[project]
name = "cache-cli"
version = "0.1.0"
description = "Command-line client that exercises the cache service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.scripts]
cache-cli = "cache_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cache_cli"]
